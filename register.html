<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register · Thyroid Intervention Summit 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0e7c76; --teal-dark:#0a3f3c; --teal-deep:#072e2c;
  --gold:#b98a2e; --gold-lt:#d9b56b; --tealsoft:#7ec7c1;
  --cream:#f4f1ea; --creamdim:#c9d9d6;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --serif:'Spectral',Georgia,serif;
  --display:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--teal-deep);display:flex;align-items:center;justify-content:center;}
body{font-family:var(--serif);color:var(--cream);-webkit-font-smoothing:antialiased;}
.dialog {
  background: rgba(10,32,30,.34);
  backdrop-filter: blur(15px) saturate(1.4);
  -webkit-backdrop-filter: blur(15px) saturate(1.4);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 22px;
  padding: 50px 60px;
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 36px;
  margin: 0 0 10px 0;
  color: var(--cream);
}
.subtitle {
  font-size: 20px;
  color: var(--creamdim);
  margin-bottom: 35px;
}
.btn {
  display: inline-block;
  background: var(--gold);
  color: var(--teal-deep);
  font-family: var(--mono);
  font-weight: 500;
  font-size: 13.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 14px 30px;
  border-radius: 9px;
  box-shadow: 0 6px 18px rgba(0,0,0,.28);
  transition: filter .12s ease, transform .12s ease;
}
.btn:hover {
  filter: brightness(1.06);
  transform: translateY(-2px);
}
</style>
</head>
<body>
  <div class="dialog">
    <h1 class="title">Registration</h1>
    <p class="subtitle">Opening Soon...</p>
    <a href="index.html" class="btn">Go Back</a>
  </div>
</body>
</html>
